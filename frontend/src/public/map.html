<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa interactivo</title>

  <!-- Estilos globales del proyecto -->
  <link rel="stylesheet" href="styles/main.css" />

  <!-- Leaflet CSS (librería de mapas) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    /* Ajustes mínimos de layout; el resto viene de main.css */
    #map {
      width: 100%;
      height: 70vh;
      border-radius: 8px;
      overflow: hidden;
    }

    .map-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .map-panel {
      flex: 2 1 400px;
    }

    .info-panel {
      flex: 1 1 260px;
      padding: 1rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      max-height: 70vh;
      overflow-y: auto;
    }

    .info-panel h2 {
      margin-top: 0;
    }

    .info-row {
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    .info-row strong {
      font-weight: 600;
    }

    .title-list {
      margin-top: 0.75rem;
      padding-left: 1.2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Mapa interactivo</h1>
      <a href="index.html" class="btn">Volver al inicio</a>
    </div>
  </header>

  <main class="container">
    <section class="map-layout">
      <!-- Contenedor del mapa -->
      <div class="map-panel">
        <div id="map"></div>
      </div>

      <!-- Panel de información del país -->
      <aside class="info-panel" id="country-info">
        <h2>Datos del país</h2>
        <p>Haz clic en un país del mapa para ver cuántos títulos del dataset tiene y algunos detalles.</p>
      </aside>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ===== 1. Inicializar mapa =====
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 6,
      minZoom: 1,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let datasetRows = [];
    let countryField = 'country';

    // ===== 2. Cargar y parsear dataset.csv con PapaParse =====
    async function loadDataset() {
      try {
        const response = await fetch("/data/dataset.csv");
        if (!response.ok) {
          throw new Error('No se pudo cargar data/dataset.csv');
        }

        const csvText = await response.text();
        const parsed = Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true
        });

        if (parsed.errors && parsed.errors.length > 0) {
          console.warn('Errores de parseo CSV:', parsed.errors);
        }

        datasetRows = parsed.data;
      } catch (err) {
        console.error(err);
        const info = document.getElementById('country-info');
        info.innerHTML = `
          <h2>Error al cargar datos</h2>
          <p>${err.message}</p>
          <p>Revisa que <code>data/dataset.csv</code> exista y que el servidor esté sirviendo el archivo.</p>
        `;
      }
    }

    // ===== 3. Filtrar filas del dataset que correspondan a un país =====
    function getRowsForCountry(featureName) {
      const target = String(featureName).trim();
      if (!target || datasetRows.length === 0) return [];

      return datasetRows.filter(row => {
        const field = row[countryField];
        if (!field) return false;

        // country puede traer múltiples países, separados por coma
        const parts = String(field).split(',').map(s => s.trim()).filter(Boolean);

        return parts.some(p => {
          // Igual exacto
          if (p === target) return true;

          if (target.includes(p) || p.includes(target)) return true;

          return false;
        });
      });
    }

    // ===== 4. Mostrar datos en el panel lateral =====
    function showCountryInfo(featureName, rows) {
      const info = document.getElementById('country-info');

      if (!rows || rows.length === 0) {
        info.innerHTML = `
          <h2>${featureName}</h2>
          <p>No hay títulos en el dataset para este país.</p>
        `;
        return;
      }

      // Calcular estadísticas básicas
      const years = rows
        .map(r => parseInt(r['release_year'], 10))
        .filter(y => !isNaN(y));

      const minYear = years.length ? Math.min(...years) : null;
      const maxYear = years.length ? Math.max(...years) : null;

      // Conteo por tipo (Movie / TV Show)
      const typeCounts = rows.reduce(
        (acc, r) => {
          const t = (r['type'] || '').trim();
          if (!t) return acc;
          acc[t] = (acc[t] || 0) + 1;
          return acc;
        },
        {}
      );

      // Tomar algunos títulos de ejemplo (máx 10)
      const sample = rows.slice(0, 10);

      let html = `<h2>${featureName}</h2>`;
      html += `<div class="info-row"><strong>Títulos en el dataset:</strong> ${rows.length}</div>`;

      if (minYear && maxYear) {
        html += `<div class="info-row"><strong>Rango de años:</strong> ${minYear} – ${maxYear}</div>`;
      }

      if (Object.keys(typeCounts).length > 0) {
        html += `<div class="info-row"><strong>Por tipo:</strong> `;
        html += Object.entries(typeCounts)
          .map(([t, c]) => `${t}: ${c}`)
          .join(' | ');
        html += `</div>`;
      }

      if (sample.length > 0) {
        html += `<h3 style="margin-top:0.8rem;">Algunos títulos</h3>`;
        html += `<ul class="title-list">`;
        sample.forEach(r => {
          const title = r['title'] || 'Sin título';
          const type = r['type'] || '';
          const year = r['release_year'] || '';
          const rating = r['rating'] || '';
          html += `<li>${title} ${year ? `(${year}` : ''}${type ? `${year ? ', ' : '('}${type}` : ''}${rating ? `, ${rating}` : ''}${(year || type || rating) ? ')' : ''}</li>`;
        });
        html += `</ul>`;
      }

      info.innerHTML = html;
    }

    // ===== 5. Cargar mapa de países (GeoJSON) y conectar con el dataset =====
    async function loadWorldLayer() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json');
        if (!response.ok) {
          throw new Error('No se pudo cargar el GeoJSON de países');
        }

        const geojson = await response.json();

        function style(feature) {
          return {
            weight: 1,
            color: '#888',
            fillColor: '#555',
            fillOpacity: 0.4
          };
        }

        function highlightStyle(feature) {
          return {
            weight: 2,
            color: '#ffcc00',
            fillColor: '#ffcc00',
            fillOpacity: 0.5
          };
        }

        let geoLayer;

        function resetHighlight(e) {
          geoLayer.resetStyle(e.target);
        }

        function onEachFeature(feature, layer) {
          const name = feature.properties && feature.properties.name
            ? feature.properties.name
            : 'País';

          layer.bindTooltip(name);

          layer.on({
            mouseover: function (e) {
              const l = e.target;
              l.setStyle(highlightStyle(feature));
              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                l.bringToFront();
              }
            },
            mouseout: resetHighlight,
            click: function () {
              const rows = getRowsForCountry(name);
              showCountryInfo(name, rows);
            }
          });
        }

        geoLayer = L.geoJSON(geojson, {
          style: style,
          onEachFeature: onEachFeature
        }).addTo(map);
      } catch (err) {
        console.error(err);
        const info = document.getElementById('country-info');
        info.innerHTML += `
          <p style="margin-top:1rem;color:#ff8080;">
            No se pudo cargar el mapa de países. Revisa tu conexión a internet o el enlace al GeoJSON.
          </p>
        `;
      }
    }

    // ===== 6. Flujo principal =====
    (async () => {
      await loadDataset();
      await loadWorldLayer();
    })();
  </script>
</body>
</html>
