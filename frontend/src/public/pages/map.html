<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa interactivo</title>
  
  <!-- Favicon (Ajusta la ruta si es necesario) -->
  <link rel="icon" type="image/png" href="images/favicon.png" />
  
  <!-- Estilos de Bootstrap (para la navbar) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Estilos Principales (para la navbar) -->
  <link rel="stylesheet" href="../styles/main.css" />
  
  <!-- ¡SOLUCIÓN! Carga Leaflet localmente para evitar errores de "Tracking Prevention" -->
  <link rel="stylesheet" href="../vendor/leaflet.css" />
  
  <!-- Estilos Específicos de esta página -->
  <link rel="stylesheet" href="../styles/map.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Header / Navbar (Usa el mismo estilo de index.html) -->
  <nav class="navbar navbar-expand navbar-dark w-100 sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">DATAFLIX</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-outline-light btn-sm">
          ← Volver al Inicio
        </a>
        <button class="btn btn-netflix-solid btn-sm" type="button" id="logoutButton">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <section class="map-layout">
      <!-- Contenedor del mapa -->
      <div class="map-panel">
        <div id="map"></div>
      </div>

      <!-- Panel de información del país -->
      <aside class="info-panel" id="country-info">
        <h2>Datos del país</h2>
        <p>Haz clic en un país del mapa para ver los títulos de Netflix asociados.</p>
        <p class="text-white-50 small">Esto llamará a la API del backend (`/api/titles-by-country`) usando tu token JWT.</p>
      </aside>
    </section>
  </main>

  <!-- ¡SOLUCIÓN! Carga Leaflet JS localmente -->
  <script src="../vendor/leaflet.js"></script>

  <!-- Scripts de Bootstrap (para la navbar, si tuviera dropdowns) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <!-- ¡LÓGICA CORREGIDA! Tu script de mapa, ahora en un archivo separado -->
  <script src="../js/map.js"></script>
</body>
</html>
