<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Grafico Netflix</title>
  <link rel="icon" type="image/png" href="../assets/favicon.ico" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- ¡RUTA CORREGIDA! -->
  <link rel="stylesheet" href="../styles/main.css">
  
  <!-- Importamos la librería de gráficos -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> 
  
  <style>
    /* Un pequeño ajuste para el tema oscuro */
    body {
        background-color: #1a1a1a;
        color: #f8f9fa;
    }
    .card {
        background-color: #2c2c2c;
        border-color: #444;
    }
    .card-header {
        border-bottom: 1px solid #444;
    }
    .alert-danger {
        background-color: #4a1d1d;
        color: #f8d7da;
        border-color: #842029;
    }
  </style>
</head>
<body>

    <div class="container-fluid mt-4">
        <!-- NAVEGACIÓN MEJORADA -->
        <div class="row justify-content-center mb-3">
             <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center">
                    
                    <!-- ¡RUTA CORREGIDA! -->
                    <a href="../index.html" class="btn btn-outline-light">
                        ← Volver al Inicio
                    </a>
                    
                    <!-- ¡CLASE CORREGIDA! -->
                    <button class="btn btn-netflix-solid btn-sm" type="button" id="logoutButton">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white d-flex align-items-center">
                        <h3 class="m-0">📊 Conteo de Títulos por País (Top 20)</h3>
                    </div>
                    <div class="card-body">
                        <!-- ¡SPINNER ELIMINADO! -->
                        <!-- El contenedor ahora está vacío y espera al script -->
                        <div id="country-bar-chart" style="width: 100%; min-height: 550px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Gráfico de Tipo -->
        <div class="row justify-content-center mt-4">
             <div class="col-lg-10">
                 <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="m-0">🎞️ Conteo por Tipo (Película vs Show)</h3>
                    </div>
                    <div class="card-body">
                        <!-- ¡SPINNER ELIMINADO! -->
                        <!-- El contenedor ahora está vacío y espera al script -->
                        <div id="type-pie-chart" style="width: 100%; min-height: 400px;">
                        </div>
                    </div>
                 </div>
             </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- El script JS no necesita cambios, ya que maneja los errores -->
    <script>
        const BACKEND_URL = 'http://127.0.0.1:5000/api'; 

        /**
         * Realiza un fetch a un endpoint protegido, adjuntando el token JWT.
         */
        async function fetchProtectedData(endpoint) {
          const token = localStorage.getItem('netflix_token');

          if (!token) {
            throw new Error('No hay token de autenticación. Inicia sesión.');
          }

          const response = await fetch(`${BACKEND_URL}/${endpoint}`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          if (response.status === 401 || response.status === 422) {
            throw new Error('Token inválido o expirado. Por favor, inicia sesión de nuevo.');
          }
          
          if (!response.ok) {
            // Manejo de errores mejorado (del historial)
            let errorJson = {};
            try {
                errorJson = await response.json();
            } catch (e) {
                throw new Error(`HTTP error! Estado: ${response.status}. Respuesta no es JSON.`);
            }
            const errorMsg = errorJson.error || JSON.stringify(errorJson);
            throw new Error(`HTTP error! Estado: ${response.status}. Respuesta: ${errorMsg}`);
          }
          
          return await response.json();
        }

        // --- FUNCIÓN PRINCIPAL: DIBUJAR EL GRÁFICO DE BARRAS ---
        async function drawBarChart() {
            const container = document.getElementById('country-bar-chart');
            
            try {
                const data = await fetchProtectedData('country-counts');
                
                const top20Data = data.slice(0, 20);
                
                const countries = top20Data.map(item => item.country).reverse(); 
                const counts = top20Data.map(item => item.count).reverse();
                
                const trace = {
                    x: counts,
                    y: countries,
                    type: 'bar',
                    orientation: 'h', 
                    marker: {
                        color: 'rgb(220, 20, 60)', // Rojo de Netflix
                        opacity: 0.9
                    }
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)', // Fondo transparente
                    plot_bgcolor: 'rgba(0,0,0,0)', // Fondo transparente
                    font: { color: '#f8f9fa' }, // Texto en blanco
                    xaxis: {
                        title: 'Cantidad de Títulos',
                        automargin: true,
                        gridcolor: '#444' // Líneas de la cuadrícula
                    },
                    yaxis: {
                        automargin: true,
                        gridcolor: '#444' // Líneas de la cuadrícula
                    },
                    margin: { l: 150, r: 20, t: 30, b: 50 } 
                };

                // 5. Dibujar el gráfico (esto reemplaza el contenido del div)
                Plotly.newPlot(container, [trace], layout, {responsive: true});
                
            } catch (error) {
                // Manejo de errores (del historial)
                console.error('Fetch error:', error);
                let errorMessage = error.message;
                let redirect = false;

                if (error.message.includes('Token inválido') || error.message.includes('No hay token')) {
                    errorMessage = `<strong>Error de Autenticación:</strong> ${error.message}<br>
                                  Verifica que hayas iniciado sesión. Serás redirigido a la página de inicio en 5 segundos.`;
                    redirect = true;
                } else {
                    errorMessage = `<strong>Error del Servidor:</strong> ${error.message}<br>
                                  Revisa la consola del servidor de Flask.`;
                }

                // Esto reemplaza el contenido del div con un error
                container.innerHTML = `<div class="alert alert-danger">${errorMessage}</div>`;

                if (redirect) {
                    localStorage.removeItem('netflix_token');
                    localStorage.removeItem('netflix_user');
                    
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 5000); 
                }
            }
        }

        // --- FUNCIÓN PARA DIBUJAR GRÁFICO DE PIE ---
        async function drawPieChart() {
            const container = document.getElementById('type-pie-chart');
            try {
                const data = await fetchProtectedData('type-counts');

                const labels = data.map(item => item.type);
                const values = data.map(item => item.count);

                const trace = {
                    labels: labels,
                    values: values,
                    type: 'pie',
                    marker: {
                        colors: ['rgb(220, 20, 60)', 'rgb(80, 80, 80)'] // Rojo Netflix y un gris
                    },
                    textinfo: "label+percent",
                    insidetextorientation: "radial"
                };

                const layout = {
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#f8f9fa' },
                    showlegend: true
                };

                // Esto reemplaza el contenido del div
                Plotly.newPlot(container, [trace], layout, {responsive: true});

            } catch (error) {
                console.error("Error al cargar gráfico de pie:", error.message);
                // Esto reemplaza el contenido del div con un error
                container.innerHTML = `<div class="alert alert-danger">
                    No se pudieron cargar los datos de tipo. ${error.message}
                </div>`;
            }
        }

        // --- LÓGICA DE LOGOUT ---
        document.getElementById('logoutButton').addEventListener('click', () => {
            localStorage.removeItem('netflix_token');
            localStorage.removeItem('netflix_user');
            window.location.href = '../index.html';
        });

        // Cargar los gráficos al iniciar la página
        window.onload = () => {
            drawBarChart(); 
            drawPieChart(); 
        };
    </script>

</body>
</html>
