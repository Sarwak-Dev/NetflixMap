<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Grafico Netflix</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Mantenemos tus estilos -->
  <link rel="stylesheet" href="styles/main.css">
  
  <!-- Importamos la librería de gráficos -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> 
  
  <style>
    /* Un pequeño ajuste para el tema oscuro */
    body {
        background-color: #1a1a1a;
        color: #f8f9fa;
    }
    .card {
        background-color: #2c2c2c;
        border-color: #444;
    }
    .card-header {
        border-bottom: 1px solid #444;
    }
    .alert-danger {
        background-color: #4a1d1d;
        color: #f8d7da;
        border-color: #842029;
    }
  </style>
</head>
<body>

    <div class="container-fluid mt-4">
        <!-- NAVEGACIÓN MEJORADA -->
        <div class="row justify-content-center mb-3">
             <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center">
                    <a href="../index.html" class="btn btn-outline-light">
                        ← Volver al Inicio
                    </a>
                    <!-- ¡NUEVO! Botón de Logout -->
                    <button class="btn btn-outline-warning" id="logoutButton">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white d-flex align-items-center">
                        <h3 class="m-0">📊 Conteo de Títulos por País (Top 20)</h3>
                    </div>
                    <div class="card-body">
                        <!-- El contenedor se llenará con Plotly o con un mensaje de error -->
                        <div id="country-bar-chart" style="width: 100%; min-height: 550px;">
                            <div class="d-flex justify-content-center align-items-center h-100">
                                <div class="spinner-border text-light" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Aquí puedes añadir más filas para más gráficos, como el de tipo -->
        <div class="row justify-content-center mt-4">
             <div class="col-lg-10">
                 <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="m-0">🎞️ Conteo por Tipo (Película vs Show)</h3>
                    </div>
                    <div class="card-body">
                        <div id="type-pie-chart" style="width: 100%; min-height: 400px;">
                            <div class="d-flex justify-content-center align-items-center h-100">
                                <div class="spinner-border text-light" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>
             </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const BACKEND_URL = 'http://127.0.0.1:5000/api'; 

        // --- ¡NUEVO! FUNCIÓN AYUDANTE PARA FETCH PROTEGIDO ---
        /**
         * Realiza un fetch a un endpoint protegido, adjuntando el token JWT.
         * @param {string} endpoint El endpoint de la API (ej. 'country-counts')
         * @returns {Promise<any>} Los datos JSON de la respuesta.
         */
        async function fetchProtectedData(endpoint) {
          const token = localStorage.getItem('netflix_token');

          if (!token) {
            // Si no hay token, no podemos continuar.
            throw new Error('No hay token de autenticación. Inicia sesión.');
          }

          const response = await fetch(`${BACKEND_URL}/${endpoint}`, {
            method: 'GET',
            headers: {
              // ¡Esta es la parte clave!
              'Authorization': `Bearer ${token}`
            }
          });

          if (response.status === 401 || response.status === 422) {
            // Token inválido o expirado.
            throw new Error('Token inválido o expirado. Por favor, inicia sesión de nuevo.');
          }
          
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP error! Estado: ${response.status}. Respuesta: ${errorText}`);
          }
          
          return await response.json();
        }

        // --- FUNCIÓN PRINCIPAL: DIBUJAR EL GRÁFICO DE BARRAS ---
        async function drawBarChart() {
            const container = document.getElementById('country-bar-chart');
            
            try {
                // ¡CAMBIO! Usamos la nueva función protegida
                const data = await fetchProtectedData('country-counts');
                
                // 2. Tomar solo los 20 países con más contenido
                const top20Data = data.slice(0, 20);
                
                // 3. Preparar los datos para Plotly
                // Invertimos el orden para que la barra más larga quede arriba
                const countries = top20Data.map(item => item.country).reverse(); 
                const counts = top20Data.map(item => item.count).reverse();
                
                // 4. Configuración del Gráfico de Barras
                const trace = {
                    x: counts,
                    y: countries,
                    type: 'bar',
                    orientation: 'h', 
                    marker: {
                        color: 'rgb(220, 20, 60)', // Rojo de Netflix
                        opacity: 0.9
                    }
                };

                const layout = {
                    // title: 'Distribución de Títulos por País (Top 20)', // El título ya está en la card
                    paper_bgcolor: 'rgba(0,0,0,0)', // Fondo transparente
                    plot_bgcolor: 'rgba(0,0,0,0)', // Fondo transparente
                    font: { color: '#f8f9fa' }, // Texto en blanco
                    xaxis: {
                        title: 'Cantidad de Títulos',
                        automargin: true,
                        gridcolor: '#444' // Líneas de la cuadrícula
                    },
                    yaxis: {
                        // title: 'País de Producción', // Se sobreentiende
                        automargin: true,
                        gridcolor: '#444' // Líneas de la cuadrícula
                    },
                    margin: { l: 150, r: 20, t: 30, b: 50 } 
                };

                // 5. Dibujar el gráfico
                Plotly.newPlot(container, [trace], layout, {responsive: true});
                
            } catch (error) {
                // Muestra un error legible si falla la conexión
                container.innerHTML = `<div class="alert alert-danger">
                    <strong>Error de Autenticación:</strong> ${error.message}<br>
                    Verifica que hayas iniciado sesión. Serás redirigido a la página de inicio en 5 segundos.
                </div>`;
                console.error('Fetch error:', error);

                // Limpiamos la sesión local por si el token expiró
                localStorage.removeItem('netflix_token');
                localStorage.removeItem('netflix_user');
                
                // Redirigimos a index.html
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000); // 5 segundos para que el usuario lea el mensaje
            }
        }

        // --- ¡NUEVO! FUNCIÓN PARA DIBUJAR GRÁFICO DE PIE ---
        async function drawPieChart() {
            const container = document.getElementById('type-pie-chart');
            try {
                // Usamos el nuevo endpoint /api/type-counts
                const data = await fetchProtectedData('type-counts');

                const labels = data.map(item => item.type);
                const values = data.map(item => item.count);

                const trace = {
                    labels: labels,
                    values: values,
                    type: 'pie',
                    marker: {
                        colors: ['rgb(220, 20, 60)', 'rgb(80, 80, 80)'] // Rojo Netflix y un gris
                    },
                    textinfo: "label+percent",
                    insidetextorientation: "radial"
                };

                const layout = {
                    // title: 'Conteo por Tipo', // Título en la card
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#f8f9fa' },
                    showlegend: true
                };

                Plotly.newPlot(container, [trace], layout, {responsive: true});

            } catch (error) {
                // No redirigimos aquí, el error principal lo hará
                container.innerHTML = `<div class="alert alert-danger">
                    No se pudieron cargar los datos de tipo. ${error.message}
                </div>`;
            }
        }


        // --- ¡NUEVO! LÓGICA DE LOGOUT ---
        document.getElementById('logoutButton').addEventListener('click', () => {
            localStorage.removeItem('netflix_token');
            localStorage.removeItem('netflix_user');
            window.location.href = 'index.html';
        });

        // Cargar los gráficos al iniciar la página
        window.onload = () => {
            drawBarChart(); // Esta función maneja la autenticación principal
            drawPieChart(); // Intentamos cargar el segundo gráfico
        };
    </script>

</body>
</html>
